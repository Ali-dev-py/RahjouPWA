<div class="row g-2 mt-2">
    <div class="col-6">
        <label class="form-label small" for="area-filter">منطقه</label>
        <select class="form-select" name="area" id="area-filter">
            <option value="">همه مناطق</option>
            {% for id, name in area_options %}<option value="{{ id }}" {% if selected_area == id %}selected{% endif %}>{{ name }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-6">
        <label class="form-label small" for="visitor-filter">ویزیتور</label>
        <select class="form-select" name="visitor" id="visitor-filter">
            <option value="">همه ویزیتورها</option>
            {% for name in visitor_options %}<option value="{{ name }}" {% if selected_visitor == name %}selected{% endif %}>{{ name }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-12"><button class="btn btn-primary btn-sm" type="submit">اعمال فیلتر</button></div>
</div>
