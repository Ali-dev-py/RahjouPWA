{% load i18n_extras %}
<div class="document-summary-actions d-flex flex-wrap gap-2 mt-3 position-relative z-2">
    {% if sale_request.can_view_shortages %}
        <a href="{% url 'core:sale_request_shortages' pk=sale_request.id %}?from=list"
           class="btn btn-sm bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill fw-semibold d-inline-flex align-items-center gap-1 px-3 py-1 position-relative z-2"
           title="مشاهده کسری"
           aria-label="مشاهده کسری درخواست {{ sale_request.number|persian_digits }}">
            <span class="material-symbols-outlined fs-6" aria-hidden="true">production_quantity_limits</span>
            <span>مشاهده کسری</span>
        </a>
    {% elif sale_request.can_modify %}
        <span class="d-flex align-items-center gap-2">
            <a href="{% url 'core:sale_request_edit' pk=sale_request.id %}?from=list"
               class="sale-request-card__download text-primary text-decoration-none position-relative z-2"
               title="ویرایش درخواست فروش"
               aria-label="ویرایش درخواست {{ sale_request.number }}">
                <span class="material-symbols-outlined fs-5" aria-hidden="true">edit</span>
            </a>
            <button type="button"
                    class="sale-request-card__download border-0 text-danger position-relative z-2 js-open-delete-sr"
                    data-bs-toggle="modal"
                    data-bs-target="#deleteSaleRequestModal"
                    data-delete-url="{% url 'core:sale_request_delete' pk=sale_request.id %}"
                    data-sr-number="{{ sale_request.number|persian_digits }}"
                    data-sr-customer="{{ sale_request.customer_name }}"
                    title="حذف درخواست فروش"
                    aria-label="حذف درخواست {{ sale_request.number }}">
                <span class="material-symbols-outlined fs-5" aria-hidden="true">delete</span>
            </button>
        </span>
    {% endif %}
</div>
