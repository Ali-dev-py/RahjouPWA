{% load static %}
<header class="app-header fixed-top">
    <div class="container-fluid app-header__inner">
        <div class="d-flex align-items-center gap-2 min-width-0">
            {% if back_url_name %}
                <a class="btn app-icon-button flex-shrink-0"
                   href="{% url back_url_name %}"
                   aria-label="بازگشت">
                    <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                </a>
            {% endif %}
            <a class="app-brand text-decoration-none min-width-0"
               href="{% url 'core:dashboard' %}">
                <img class="app-brand__logo" src="{% static 'images/logo.png' %}" alt="نشان رهجو">
            </a>
            <span dir="rtl" class="app-brand__title position-absolute top-50 start-50 translate-middle text-center text-truncate">
                {{ heading }}
            </span>
        </div>
        {% if not back_url_name %}
            <a class="app-avatar text-decoration-none"
               href="{% url 'core:logout' %}"
               aria-label="ورود به حساب کاربری">
                <span class="material-symbols-outlined" aria-hidden="true">logout</span>
            </a>
        {% endif %}
    </div>
</header>
