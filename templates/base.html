{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="رهجو؛ مدیریت هوشمند فروش و حسابداری">
    <meta name="theme-color" content="#1a56db">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="رهجو">
    <meta name="application-name" content="رهجو">
    <meta name="msapplication-TileColor" content="#1a56db">
    <meta name="msapplication-TileImage" content="{% static 'icons/icon-192.png' %}">
    <meta name="format-detection" content="telephone=no">

    <title>{% block title %}رهجو{% endblock %}</title>
    {% block extra_head %}{% endblock %}

    <link rel="manifest" href="{% url 'web_app_manifest' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/apple-touch-icon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="{% static 'css/app.css' %}?v=9" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}app-body{% endblock %}"
      data-service-worker-url="{% url 'service_worker' %}">
    <div class="page-loading-overlay"
         data-page-loader
         role="status"
         aria-live="polite"
         aria-label="در حال بارگذاری صفحه"
         aria-hidden="true"
         hidden>
        <span class="page-loading-spinner" aria-hidden="true"></span>
        <span class="visually-hidden">در حال بارگذاری...</span>
    </div>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="{% static 'js/app.js' %}?v=9" defer></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
