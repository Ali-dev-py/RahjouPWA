<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"error":"#ba1a1a","surface-bright":"#f8f9fa","surface-tint":"#1353d8","on-tertiary-container":"#7af3bb","secondary-fixed":"#ffdf9e","on-surface":"#191c1d","outline":"#737686","on-secondary-fixed-variant":"#5b4300","tertiary-fixed-dim":"#63dca6","on-error-container":"#93000a","inverse-on-surface":"#f0f1f2","tertiary":"#005438","surface-container-lowest":"#ffffff","secondary":"#785900","surface-container-highest":"#e1e3e4","surface":"#f8f9fa","primary-container":"#1a56db","primary-fixed":"#dbe1ff","on-secondary":"#ffffff","background":"#f8f9fa","on-primary-container":"#d4dcff","on-background":"#191c1d","primary":"#003fb1","on-tertiary-fixed":"#002113","on-primary-fixed":"#00174d","surface-container-high":"#e7e8e9","on-error":"#ffffff","on-surface-variant":"#434654","tertiary-container":"#006f4b","surface-variant":"#e1e3e4","on-primary-fixed-variant":"#003dab","on-tertiary-fixed-variant":"#005236","primary-fixed-dim":"#b5c4ff","surface-container-low":"#f3f4f5","on-primary":"#ffffff","surface-container":"#edeeef","outline-variant":"#c3c5d7","secondary-container":"#fdc003","error-container":"#ffdad6","inverse-primary":"#b5c4ff","inverse-surface":"#2e3132","on-tertiary":"#ffffff","on-secondary-fixed":"#261a00","surface-dim":"#d9dadb","tertiary-fixed":"#81f9c1","secondary-fixed-dim":"#fabd00","on-secondary-container":"#6c5000"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"stack-md":"1rem","stack-lg":"1.5rem","stack-sm":"0.5rem","gutter-mobile":"0.75rem","margin-mobile":"1rem"},"fontFamily":{"body-lg":["Vazirmatn"],"body-md":["Vazirmatn"],"headline-lg-mobile":["Vazirmatn"],"headline-lg":["Vazirmatn"],"headline-md":["Vazirmatn"],"label-sm":["Vazirmatn"],"label-lg":["Vazirmatn"]},"fontSize":{"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-lg-mobile":["22px",{"lineHeight":"30px","fontWeight":"700"}],"headline-lg":["24px",{"lineHeight":"32px","fontWeight":"700"}],"headline-md":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-sm":["12px",{"lineHeight":"16px","fontWeight":"500"}],"label-lg":["14px",{"lineHeight":"20px","fontWeight":"600"}]}}}}</script></head><body class="bg-background font-body-md text-on-background"><main class="relative w-full"><div class="flex flex-col w-full h-full min-h-[100dvh] bg-surface items-center justify-center p-6 relative overflow-hidden">
<!-- Subtle Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03]" style="background-image: radial-gradient(circle at 2px 2px, var(--tw-colors-on-surface) 1px, transparent 0); background-size: 24px 24px;"></div>
<!-- Ambient Glow -->
<div class="absolute top-[-10%] right-[-10%] w-[50vw] h-[50vw] bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-secondary/10 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Main Card Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[24px] shadow-[0_8px_32px_rgba(0,0,0,0.04)] p-8 relative z-10 flex flex-col items-center">
<!-- Logo -->
<div class="w-24 h-24 mb-6 rounded-2xl overflow-hidden shadow-sm flex-shrink-0">
<img alt="Rahjou Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfM7JJRBXWqTQMEweMG21Zc6JGx5q7Wzvm_AP7OBrPrZeLasQjg6YJx9-PK669SJcyHySsHt6ZJOi58sDHaLugYu-OaI6EqHOLLxXLDDQ_xbX8frkRTqPJQWIbZprYcdv9mYUewKsWnUK2dqvopkYLynlNEzd4jFUIUZlrbeGReFlvKV6XjeHdINExBhvSprW3IU9Ygo4UnkU0IjZ-FfbgbYD3xSfRhVwZ0u4kswfpDrSIALqIRbYfGLjpIz0D0OtSuOk"/>
</div>
<!-- Header -->
<h1 class="text-headline-lg-mobile text-on-surface mb-2 text-center w-full">ورود به سیستم</h1>
<p class="text-body-md text-outline mb-8 text-center w-full">جهت ورود اطلاعات خود را وارد نمایید</p>
<!-- Form -->
<form class="w-full flex flex-col gap-5" id="loginForm">
<!-- Username Field -->
<div class="flex flex-col gap-2 relative group">
<label class="text-label-lg text-on-surface-variant px-1 transition-colors group-focus-within:text-primary" for="username">نام کاربری / ایمیل</label>
<div class="relative flex items-center bg-surface-container-low rounded-xl transition-shadow group-focus-within:shadow-[0_0_0_2px_var(--tw-colors-primary)]">
<span class="material-symbols-outlined absolute right-4 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-transparent text-body-lg text-on-surface py-3.5 pr-12 pl-4 focus:outline-none placeholder:text-outline-variant rounded-xl" id="username" placeholder="مثال: ali.rezaii" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2 relative group">
<div class="flex justify-between items-center px-1">
<label class="text-label-lg text-on-surface-variant transition-colors group-focus-within:text-primary" for="password">رمز عبور</label>
<a class="text-label-sm text-primary hover:text-primary-fixed-variant transition-colors" href="#">رمز عبور را فراموش کرده‌اید؟</a>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl transition-shadow group-focus-within:shadow-[0_0_0_2px_var(--tw-colors-primary)]">
<span class="material-symbols-outlined absolute right-4 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-transparent text-body-lg text-on-surface py-3.5 pr-12 pl-12 focus:outline-none placeholder:text-outline-variant rounded-xl tracking-widest font-sans" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="نمایش رمز عبور" class="absolute left-2 w-10 h-10 flex items-center justify-center text-outline hover:text-on-surface-variant transition-colors rounded-lg focus:outline-none focus:bg-surface-variant/50 active:scale-95" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary text-label-lg py-4 rounded-xl mt-4 shadow-[0_4px_12px_rgba(0,63,177,0.2)] hover:bg-primary/90 hover:shadow-[0_6px_16px_rgba(0,63,177,0.25)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group relative overflow-hidden" type="submit">
<span class="relative z-10">ورود</span>
<span class="material-symbols-outlined text-[20px] relative z-10 transition-transform group-hover:-translate-x-1">arrow_back</span>
<div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
</button>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center text-body-md text-on-surface-variant">
      حساب کاربری ندارید؟ <a class="text-primary font-bold hover:underline underline-offset-4 decoration-2" href="#">ثبت نام کنید</a>
</div>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const passwordIcon = document.getElementById('passwordIcon');
    const form = document.getElementById('loginForm');

    // Toggle Password Visibility
    toggleButton.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      passwordIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
      
      // Add slight pop animation to icon
      passwordIcon.style.transform = 'scale(0.8)';
      setTimeout(() => {
        passwordIcon.style.transform = 'scale(1)';
      }, 150);
    });

    // Form Submit Animation
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = form.querySelector('button[type="submit"]');
      const originalContent = btn.innerHTML;
      
      // Loading state
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
      btn.classList.add('opacity-80', 'pointer-events-none');
      
      // Simulate network request
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined">check</span><span class="font-bold">با موفقیت وارد شدید</span>';
        btn.classList.replace('bg-primary', 'bg-tertiary');
        btn.classList.replace('shadow-[0_4px_12px_rgba(0,63,177,0.2)]', 'shadow-[0_4px_12px_rgba(0,84,56,0.2)]');
        
        // Reset after success indication (for demo purposes)
        setTimeout(() => {
          btn.innerHTML = originalContent;
          btn.classList.remove('opacity-80', 'pointer-events-none');
          btn.classList.replace('bg-tertiary', 'bg-primary');
          btn.classList.replace('shadow-[0_4px_12px_rgba(0,84,56,0.2)]', 'shadow-[0_4px_12px_rgba(0,63,177,0.2)]');
        }, 2000);
      }, 1500);
    });
  });
</script></main></body></html>
