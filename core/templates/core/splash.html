{% extends "base.html" %}
{% load static %}

{% block title %}رهجو | در حال بارگذاری{% endblock %}
{% block extra_head %}
    <meta http-equiv="refresh" content="3;url={% url 'core:login' %}">
{% endblock %}
{% block body_class %}page-splash{% endblock %}

{% block content %}
<main class="splash-screen d-flex flex-column align-items-center justify-content-center position-relative overflow-hidden"
      data-splash-redirect-url="{% url 'core:login' %}"
      data-splash-redirect-delay="2500">
    <div class="splash-screen__ambient" aria-hidden="true">
        <span class="splash-screen__orb splash-screen__orb--top"></span>
        <span class="splash-screen__orb splash-screen__orb--bottom"></span>
        <svg class="splash-screen__grid" width="100%" height="100%">
            <defs>
                <pattern id="splash-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a56db" stroke-width="0.5"></path>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#splash-grid)"></rect>
        </svg>
    </div>

    <a class="splash-screen__content d-flex flex-column align-items-center text-decoration-none"
       href="{% url 'core:login' %}"
       aria-label="ورود به رهجو">
        <span class="splash-logo d-flex align-items-center justify-content-center position-relative">
            <svg class="splash-logo__sparkle" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 0l2.5 9.5L24 12l-9.5 2.5L12 24l-2.5-9.5L0 12l9.5-2.5z"></path>
            </svg>
            <img src="{% static 'images/logo.png' %}" alt="رهجو">
        </span>
        <h1 class="h4 text-dark fw-bold mt-4 mb-2">رهجو</h1>
        <p class="splash-screen__tagline text-center mb-0">مدیریت هوشمند فروش و حسابداری</p>
    </a>

    <div class="splash-loader d-flex flex-column align-items-center" aria-live="polite">
        <div class="progress splash-loader__track" role="progressbar" aria-label="در حال بارگذاری">
            <div class="progress-bar splash-loader__bar"></div>
        </div>
        <span class="mt-3">در حال بارگذاری...</span>
    </div>
</main>
{% endblock %}
